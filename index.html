<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ============================================================
     LO ÚNICO EDITABLE DE ESTE ARCHIVO: el título de la pestaña del
     navegador y la descripción que sale en Google. Todo lo demás
     del sitio (textos, videos, clientes, productos, experiencia)
     se edita en la carpeta contenido/ — ver contenido/LEEME.md.
     ============================================================ -->
<title>Anton Ray — Creative Producer · VFX Supervisor · Rigging TD</title>
<meta name="description" content="Anton Ray (Space Joints) — Creative Producer, VFX Supervisor y Rigging TD en Ciudad de México. Honda, TV Azteca, VISA, Marinela, L'Oréal, Telcel, Volaris.">

<!-- Ícono de la pestaña del navegador -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Los estilos están separados por sección en css/ — ver css/base.css
     para variables de color, tipografía, etc. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/reels.css">
<link rel="stylesheet" href="css/tienda.css">
<link rel="stylesheet" href="css/shorts.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/clientes.css">
<link rel="stylesheet" href="css/experiencia.css">
<link rel="stylesheet" href="css/competencias.css">
<link rel="stylesheet" href="css/educacion.css">
<link rel="stylesheet" href="css/contacto.css">
</head>
<body>

<div class="grain-overlay"></div>

<nav class="hud-nav">
  <a href="#hero" class="hud-nav__brand">
    <img src="assets/logo-spacejoints.png" alt="Space Joints" class="hud-nav__logo">
    <span>ANTON RAY</span>
  </a>
  <div class="hud-nav__links" id="hud-nav-links">
    <div class="nav-dropdown">
      <a href="#reels" class="nav-dropdown__trigger"><span data-txt="nav_reels"></span> <span class="nav-dropdown__caret">▾</span></a>
      <div class="nav-dropdown__menu">
        <a href="#reel" class="open-reel-modal" data-txt="nav_rigging"></a>
        <a href="#reels" data-tab="scripting" data-txt="nav_scripting"></a>
        <a href="#reels" data-tab="mocap" data-txt="nav_mocap"></a>
      </div>
    </div>
    <a href="#store" data-txt="nav_store"></a>
    <a href="#clientes" data-txt="nav_clients"></a>
    <a href="#experiencia" data-txt="nav_experience"></a>
    <a href="#competencias" data-txt="nav_skills"></a>
    <a href="#contacto" data-txt="nav_contact"></a>
  </div>
  <div class="hud-nav__right">
    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
      <button type="button" class="lang-btn is-active" data-lang="es">ES</button>
      <span class="lang-toggle__sep">/</span>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <div class="rec-indicator"><span class="rec-dot"></span>REC</div>
    <button class="hud-nav__toggle" type="button" id="hud-nav-toggle" aria-label="Menú" aria-expanded="false" aria-controls="hud-nav-links">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- HERO -->
<header class="hero" id="hero">
  <div class="hero__corner hero__corner--tl"></div>
  <div class="hero__corner hero__corner--tr"></div>
  <div class="hero__corner hero__corner--bl"></div>
  <div class="hero__corner hero__corner--br"></div>

  <div class="hero__content">
    <p class="hero__eyebrow" data-txt="hero_eyebrow"></p>
    <h1 class="hero__name" data-txt="hero_nombre"></h1>
    <p class="hero__alias" data-txt="hero_alias"></p>
    <h2 class="hero__title" data-txt="hero_puesto" data-puntos></h2>
    <p class="hero__tagline" data-txt="hero_tagline"></p>
    <a href="#reel" class="btn btn--primary open-reel-modal">
      <span class="btn__icon">▶</span> <span data-txt="hero_boton_reel"></span>
    </a>

    <div class="hero__quicklinks">
      <a href="#reels" data-tab="rigging" class="hero__quicklink" data-txt="hero_quick_rigging"></a>
      <a href="#reels" data-tab="scripting" class="hero__quicklink" data-txt="hero_quick_script"></a>
      <a href="#reels" data-tab="mocap" class="hero__quicklink" data-txt="hero_quick_mocap"></a>
    </div>
  </div>

  <div class="hero__scroll">
    <span data-txt="hero_scroll"></span>
    <div class="hero__scroll-line"></div>
  </div>
</header>

<!-- CLIPS (SHORTS) — las tarjetas salen de contenido/videos.js -->
<section class="shorts">
  <p class="section-label" data-txt="label_clips"></p>

  <div class="shorts__player" id="shorts-player">
    <div class="shorts__player-frame"></div>
    <button class="shorts__player-close" id="shorts-player-close" type="button" aria-label="Cerrar">✕</button>
  </div>

  <div class="shorts__wrap">
    <button class="shorts__nav shorts__nav--prev" type="button" aria-label="Anteriores">‹</button>
    <div class="shorts__marquee">
      <div class="shorts__track" id="shorts-track"></div>
    </div>
    <button class="shorts__nav shorts__nav--next" type="button" aria-label="Siguientes">›</button>
  </div>

  <a href="#" target="_blank" rel="noopener" class="shorts__more" id="liga-youtube" data-txt="shorts_more"></a>
</section>

<!-- REELS — demos y breakdowns salen de contenido/videos.js,
     las tarjetas de texto de contenido/trabajos.js -->
<section class="work" id="reels">
  <p class="section-label" data-txt="label_reels"></p>

  <div class="tabs" role="tablist">
    <button class="tab-btn is-active" role="tab" aria-selected="true" data-tab="rigging" data-txt="tab_rigging"></button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="scripting" data-txt="tab_scripting"></button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="mocap" data-txt="tab_mocap"></button>
  </div>

  <div class="tab-panels">
    <div class="tab-panel is-active" id="panel-rigging" role="tabpanel">
      <div class="mini-reel" id="reel-rigging"></div>
      <div class="work-grid"></div>
    </div>
    <div class="tab-panel" id="panel-scripting" role="tabpanel" hidden>
      <div class="mini-reel" id="reel-scripting"></div>
      <div class="work-grid"></div>
    </div>
    <div class="tab-panel" id="panel-mocap" role="tabpanel" hidden>
      <div class="mini-reel" id="reel-mocap"></div>
      <div class="work-grid"></div>
    </div>
  </div>
</section>

<!-- TIENDA — los productos salen de contenido/tienda.js -->
<section class="store" id="store">
  <p class="section-label" data-txt="label_store"></p>

  <div class="gumroad-strip">
    <button class="shorts__nav gumroad-nav--prev" type="button" aria-label="Anteriores" id="gumroad-nav-prev">‹</button>
    <div class="gumroad-track" id="gumroad-grid"></div>
    <button class="shorts__nav gumroad-nav--next" type="button" aria-label="Siguientes" id="gumroad-nav-next">›</button>
  </div>
  <a href="#" target="_blank" rel="noopener" class="btn btn--outline" id="liga-tienda" data-txt="store_link"></a>
</section>

<!-- CLIENTES — videos y marcas salen de contenido/clientes.js -->
<section class="clients" id="clientes">
  <p class="section-label" data-txt="label_clients"></p>

  <div class="clients__player" id="clients-player">
    <div class="clients__player-frame"></div>
    <button class="clients__player-close" id="clients-player-close" type="button" aria-label="Cerrar">✕</button>
  </div>

  <div class="clients__wrap">
    <button class="shorts__nav clients__nav--prev" type="button" aria-label="Anteriores">‹</button>
    <div class="clients__track-mask">
      <div class="clients__track" id="clients-track"></div>
    </div>
    <button class="shorts__nav clients__nav--next" type="button" aria-label="Siguientes">›</button>
  </div>

  <div class="clients__logos" id="clients-logos"></div>
</section>

<!-- EXPERIENCIA — sale de contenido/experiencia.js -->
<section class="experience" id="experiencia">
  <p class="section-label" data-txt="label_experience"></p>
  <div class="timeline"></div>
</section>

<!-- COMPETENCIAS — salen de contenido/competencias.js -->
<section class="skills" id="competencias">
  <p class="section-label" data-txt="label_skills"></p>
  <div class="skills__grid"></div>
</section>

<!-- EDUCACIÓN — sale de contenido/experiencia.js -->
<section class="education">
  <p class="section-label" data-txt="label_education"></p>
  <div class="education__grid"></div>
</section>

<!-- CONTACTO — sale de contenido/contacto.js -->
<footer class="contact" id="contacto">
  <p class="section-label" data-txt="label_contact"></p>
  <h2 class="contact__headline" data-txt="contact_headline"></h2>

  <div class="contact__grid"></div>

  <div class="contact__footer-bottom">
    <span data-txt="footer_copyright"></span>
    <span data-txt="footer_credit"></span>
  </div>
</footer>

<!-- Ventana del reel — la abre "Ver Reel" del hero y "Rigging" del menú -->
<div class="reel-modal" id="reel-modal">
  <div class="reel-modal__backdrop" id="reel-modal-backdrop"></div>
  <div class="reel-modal__frame">
    <button class="reel-modal__close" id="reel-modal-close" type="button" aria-label="Cerrar">✕</button>
    <div class="reel-modal__video" id="reel-modal-video"></div>
  </div>
</div>

<!-- Embed oficial de Gumroad — convierte los bloques que agrega
     js/tienda.js en la vista previa real del producto -->
<script src="https://gumroad.com/js/gumroad-embed.js"></script>

<!-- ============================================================
     CONTENIDO — lo que edita Anton (ver contenido/LEEME.md).
     Va antes que los scripts de abajo.
     ============================================================ -->
<script src="contenido/textos.js"></script>
<script src="contenido/videos.js"></script>
<script src="contenido/trabajos.js"></script>
<script src="contenido/tienda.js"></script>
<script src="contenido/clientes.js"></script>
<script src="contenido/experiencia.js"></script>
<script src="contenido/competencias.js"></script>
<script src="contenido/contacto.js"></script>

<!-- ============================================================
     COMPORTAMIENTO — el armazón del sitio, separado por sección.
     idioma.js va HASTA EL FINAL a propósito: pinta los textos y
     necesita que todas las tarjetas ya existan.
     ============================================================ -->
<script src="js/core.js"></script>
<script src="js/nav.js"></script>
<script src="js/modal.js"></script>
<script src="js/reels.js"></script>
<script src="js/tabs.js"></script>
<script src="js/shorts.js"></script>
<script src="js/clientes.js"></script>
<script src="js/tienda.js"></script>
<script src="js/experiencia.js"></script>
<script src="js/competencias.js"></script>
<script src="js/contacto.js"></script>
<script src="js/idioma.js"></script>
<script src="js/scroll-reveal.js"></script>
<script src="js/smooth-scroll.js"></script>
</body>
</html>
